name: solo22-materialscope
services:
  app:
    build: .
    image: solo22-materialscope:1.0
    ports:
      - "127.0.0.1:18922:18922"
    volumes:
      - materialscope-data:/data
    environment:
      MATERIALSCOPE_DATA_DIR: /data
      PORT: "18922"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18922/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  materialscope-data:
